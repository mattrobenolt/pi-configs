  "@types/node": ^26.6.6
  "@types/turndown": ^5.0.6
  defuddle: 0.19.6
  hysnappy: ^1.1.1
  marked: ^18.1.3
  oxfmt: ^0.77.0
  oxlint: ^1.92.0
  turndown: ^7.2.5
  typebox: ^1.4.4
  typescript: ^7.0.2

allowBuilds:
